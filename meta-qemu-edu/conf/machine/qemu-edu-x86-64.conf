#@TYPE: Machine
#@NAME: QEMU EDU x86-64 learning machine
#@DESCRIPTION: qemux86-64 with QEMU's educational PCI device attached

# Reuse the tested qemux86-64 BSP, then add one virtual peripheral.
require conf/machine/qemux86-64.conf

# linux-yocto is explicitly compatible with qemux86-64.  Adding this override
# lets this derived machine reuse the same kernel branch and kernel features.
MACHINEOVERRIDES =. "qemux86-64:"

# kernel-yocto selects its BSP metadata by KMACHINE, which otherwise defaults
# to the derived MACHINE name even when qemux86-64 is in MACHINEOVERRIDES.
KMACHINE = "qemux86-64"

# QEMU's EDU device is a conventional PCI device.  The normal qemux86-64
# configuration uses Q35/PCIe, so this lab intentionally selects the classic
# PC machine, which has a conventional PCI bus and keeps the command line clear.
QB_CPU:x86-64 = "-cpu Skylake-Client -machine pc,i8042=off"
QB_CPU_KVM:x86-64 = "-cpu Skylake-Client -machine pc,i8042=off"

# This line is the virtual equivalent of soldering the peripheral onto a board.
QB_OPT_APPEND:append = " -device edu"

# Hardware-required software belongs in the machine, not in every image recipe.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " qemu-edu-driver"
