#@TYPE: Machine
#@NAME: QEMU EDU ARM64 platform learning machine
#@DESCRIPTION: qemuarm64 with a Device Tree-described educational platform device

require conf/machine/qemuarm64.conf

# Reuse the exact qemuarm64 kernel branch, revisions, and BSP metadata.
MACHINEOVERRIDES =. "qemuarm64:"
KMACHINE = "qemuarm64"

# The reviewed project-local model is dynamically placed on virt's platform
# bus; QEMU generates its qemu,edu-platform Device Tree node.
QB_OPT_APPEND:append = " -device qemu-edu-platform"

# Both project machines share one reviewed native-QEMU patch set. Fail closed
# if that set is ever considered with another system-emulator recipe version.
REQUIRED_VERSION_qemu-system-native = "10.2.0"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = " qemu-edu-platform-driver"
