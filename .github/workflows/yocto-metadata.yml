# SPDX-License-Identifier: MIT
name: Yocto metadata

on:
  pull_request:
    paths:
      - ".github/workflows/yocto-metadata.yml"
      - "config/sources.lock.json"
      - "config/labs/**"
      - "scripts/source_lock.py"
      - "scripts/lab_config.py"
      - "scripts/configure_build.py"
      - "scripts/qemu_security_preflight.sh"
      - "scripts/verify_qemu_security.py"
      - "setup.sh"
      - "environment.sh"
      - "build.sh"
      - "inspect.sh"
      - "run.sh"
      - "runtime-test.sh"
      - "Makefile"
      - "meta-qemu-edu/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/yocto-metadata.yml"
      - "config/sources.lock.json"
      - "config/labs/**"
      - "scripts/source_lock.py"
      - "scripts/lab_config.py"
      - "scripts/configure_build.py"
      - "scripts/qemu_security_preflight.sh"
      - "scripts/verify_qemu_security.py"
      - "setup.sh"
      - "environment.sh"
      - "build.sh"
      - "inspect.sh"
      - "run.sh"
      - "runtime-test.sh"
      - "Makefile"
      - "meta-qemu-edu/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  metadata:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Yocto host packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk gcc git \
            iputils-ping libacl1 libcrypt-dev locales python3 python3-git \
            python3-jinja2 python3-pexpect python3-pip python3-subunit \
            python3-websockets socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Allow BitBake user namespaces
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net true
      - name: Resolve and verify locked sources
        env:
          BUILD_DIR: ${{ runner.temp }}/yocto-build
        run: |
          echo "runner=${ImageOS:-unknown} image-version=${ImageVersion:-unknown}"
          python3 scripts/source_lock.py validate
          ./setup.sh
          ./setup.sh --check
          ./setup.sh --offline
          python3 scripts/source_lock.py --format json status
      - name: Parse and inspect metadata
        env:
          BUILD_DIR: ${{ runner.temp }}/yocto-build
        run: |
          ./inspect.sh
          # shellcheck source=environment.sh
          source ./environment.sh
          bitbake -p
          SHOW_APPENDS="$RUNNER_TEMP/qemu-system-native-appends.txt"
          bitbake-layers show-appends qemu-system-native | tee "$SHOW_APPENDS"
          QEMU_PN=$(bitbake-getvar --value --recipe qemu-system-native PN)
          QEMU_PV=$(bitbake-getvar --value --recipe qemu-system-native PV)
          QEMU_FILE=$(bitbake-getvar --value --recipe qemu-system-native FILE)
          QEMU_SRC_URI=$(bitbake-getvar --value --recipe qemu-system-native SRC_URI)
          TESTIMAGE_DEPENDS=$(bitbake-getvar --value --recipe qemu-edu-image TESTIMAGEDEPENDS)
          HELPER_DEPENDS=$(bitbake-getvar --value --recipe qemu-helper-native DEPENDS)
          python3 "$GITHUB_WORKSPACE/scripts/verify_qemu_security.py" \
            --repo "$GITHUB_WORKSPACE" metadata \
            --show-appends "$SHOW_APPENDS" \
            --pn "$QEMU_PN" \
            --pv "$QEMU_PV" \
            --recipe-file "$QEMU_FILE" \
            --src-uri "$QEMU_SRC_URI" \
            --testimage-depends "$TESTIMAGE_DEPENDS" \
            --helper-depends "$HELPER_DEPENDS"
      - name: Parse and inspect ARM64 platform metadata
        env:
          BUILD_DIR: ${{ runner.temp }}/yocto-build-platform-arm64
        run: |
          ./setup.sh --lab platform-arm64 --offline
          ./inspect.sh --lab platform-arm64
          export QEMU_EDU_LAB=platform-arm64
          # shellcheck source=environment.sh
          source ./environment.sh
          bitbake -p
          SHOW_APPENDS="$RUNNER_TEMP/qemu-system-native-platform-appends.txt"
          bitbake-layers show-appends qemu-system-native | tee "$SHOW_APPENDS"
          QEMU_PN=$(bitbake-getvar --value --recipe qemu-system-native PN)
          QEMU_PV=$(bitbake-getvar --value --recipe qemu-system-native PV)
          QEMU_FILE=$(bitbake-getvar --value --recipe qemu-system-native FILE)
          QEMU_SRC_URI=$(bitbake-getvar --value --recipe qemu-system-native SRC_URI)
          TESTIMAGE_DEPENDS=$(bitbake-getvar --value --recipe qemu-edu-image TESTIMAGEDEPENDS)
          HELPER_DEPENDS=$(bitbake-getvar --value --recipe qemu-helper-native DEPENDS)
          python3 "$GITHUB_WORKSPACE/scripts/verify_qemu_security.py" \
            --repo "$GITHUB_WORKSPACE" metadata \
            --show-appends "$SHOW_APPENDS" \
            --pn "$QEMU_PN" \
            --pv "$QEMU_PV" \
            --recipe-file "$QEMU_FILE" \
            --src-uri "$QEMU_SRC_URI" \
            --testimage-depends "$TESTIMAGE_DEPENDS" \
            --helper-depends "$HELPER_DEPENDS" \
            --profile qemu-edu-platform-v1
      - name: Check the project layer
        run: |
          CHECK_LAYER_BUILD_DIR="$RUNNER_TEMP/yocto-check-layer-build"
          export PATH="$GITHUB_WORKSPACE/layers/bitbake/bin:$PATH"
          unset DISTRO MACHINE TEMPLATECONF
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/layers/openembedded-core/oe-init-build-env" \
            "$CHECK_LAYER_BUILD_DIR" >/dev/null
          printf '\nDISTRO = "nodistro"\nMACHINE ??= "qemux86-64"\n' \
            >> "$CHECK_LAYER_BUILD_DIR/conf/local.conf"

          ACTUAL_MACHINE=$(bitbake-getvar --value MACHINE)
          if [ "$ACTUAL_MACHINE" != "qemux86-64" ]; then
            echo "Unexpected base MACHINE: $ACTUAL_MACHINE" >&2
            exit 1
          fi

          EXPECTED_CORE_LAYER="$GITHUB_WORKSPACE/layers/openembedded-core/meta"
          ACTUAL_BBLAYERS=$(bitbake-getvar --value BBLAYERS)
          read -r -a ACTUAL_LAYERS <<< "$ACTUAL_BBLAYERS"
          if [ "${#ACTUAL_LAYERS[@]}" -ne 1 ] || \
             [ "${ACTUAL_LAYERS[0]}" != "$EXPECTED_CORE_LAYER" ]; then
            echo "Layer-check base must contain only OE-Core: $ACTUAL_BBLAYERS" >&2
            exit 1
          fi

          yocto-check-layer \
            --no-auto \
            --no-auto-dependency \
            --dependency "$EXPECTED_CORE_LAYER" \
            --machines qemu-edu-x86-64 qemu-edu-platform-arm64 \
            -- "$GITHUB_WORKSPACE/meta-qemu-edu"
