# SPDX-License-Identifier: MIT
name: Fast checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository checks
        run: |
          python3 scripts/source_lock.py validate
          python3 scripts/lab_config.py validate
          python3 scripts/validate_workflow.py
          python3 scripts/validate_ci.py
          python3 scripts/verify_qemu_security.py static
          python3 scripts/verify_diagnostics_schema_lock.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/update_checksums.py --check
      - name: Patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  static:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified static tools
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          install -d "$RUNNER_TEMP/m1-tools/shellcheck" "$RUNNER_TEMP/m1-tools/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/m1-tools/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$RUNNER_TEMP/m1-tools/shellcheck.tar.xz" | \
            sha256sum --check --strict
          tar --extract --xz --file "$RUNNER_TEMP/m1-tools/shellcheck.tar.xz" \
            --directory "$RUNNER_TEMP/m1-tools/shellcheck" --strip-components 1
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/m1-tools/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/m1-tools/actionlint.tar.gz" | \
            sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/m1-tools/actionlint.tar.gz" \
            --directory "$RUNNER_TEMP/m1-tools/actionlint" actionlint
      - name: Static analysis
        run: |
          bash -n setup.sh environment.sh build.sh inspect.sh run.sh \
            runtime-test.sh scripts/qemu_security_preflight.sh
          sh -n meta-qemu-edu/recipes-support/qemu-edu-tools/files/qemu-edu-test \
            meta-qemu-edu/recipes-support/qemu-edu-platform-tools/files/qemu-edu-platform-test
          "$RUNNER_TEMP/m1-tools/shellcheck/shellcheck" --severity=warning \
            setup.sh environment.sh build.sh inspect.sh run.sh runtime-test.sh \
            scripts/qemu_security_preflight.sh \
            meta-qemu-edu/recipes-support/qemu-edu-tools/files/qemu-edu-test \
            meta-qemu-edu/recipes-support/qemu-edu-platform-tools/files/qemu-edu-platform-test
          "$RUNNER_TEMP/m1-tools/actionlint/actionlint" \
            -shellcheck="$RUNNER_TEMP/m1-tools/shellcheck/shellcheck"

  diagnostics-schema:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select CPython 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: false
      - name: Verify the independent schema contract
        run: |
          schema_root="$RUNNER_TEMP/a006-schema"
          wheel_root="$schema_root/wheels"
          environment_root="$schema_root/environment"
          MAX_WHEEL_BYTES=1048576
          trap 'rm -rf -- "$schema_root"' EXIT
          export PIP_NO_CACHE_DIR=1
          install -d "$wheel_root"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/attrs-26.1.0-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/64/b4/17d4b0b2a2dc85a6df63d1157e028ed19f90d4cd97c36717afef2bc2f395/attrs-26.1.0-py3-none-any.whl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/jsonschema-4.26.0-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/69/90/f63fb5873511e014207a475e2bb4e8b2e570d655b00ac19a9a0ca0a385ee/jsonschema-4.26.0-py3-none-any.whl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/jsonschema_specifications-2025.9.1-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/41/45/1a4ed80516f02155c51f51e8cedb3c1902296743db0bbc66608a0db2814f/jsonschema_specifications-2025.9.1-py3-none-any.whl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/referencing-0.37.0-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/2c/58/ca301544e1fa93ed4f80d724bf5b194f6e4b945841c5bfd555878eea9fcb/referencing-0.37.0-py3-none-any.whl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/rpds_py-2026.6.3-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
            https://files.pythonhosted.org/packages/04/8f/d2f3f532616be4d06c316ef119683e832bd3d41e112bf3a88f4151c95b17/rpds_py-2026.6.3-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-filesize "$MAX_WHEEL_BYTES" \
            --output "$wheel_root/typing_extensions-4.16.0-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/49/d3/b8441a820a491ddfc024b0b0cf0393375b75ea13866d9c66727e54c2fc80/typing_extensions-4.16.0-py3-none-any.whl
          python3 scripts/verify_diagnostics_schema_lock.py --wheel-directory "$wheel_root"
          python3 -m venv "$environment_root"
          "$environment_root/bin/python" -m pip install \
            --no-index --no-deps --only-binary=:all: \
            --disable-pip-version-check --no-input "$wheel_root"/*.whl
          "$environment_root/bin/python" scripts/verify_diagnostics_schema_lock.py --installed
          "$environment_root/bin/python" -B tests/validate_diagnostics_schema.py

  licensing:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: REUSE compliance
        run: |
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$GITHUB_WORKSPACE:/data:ro" \
            --workdir /data \
            --env PYTHONDONTWRITEBYTECODE=1 \
            fsfe/reuse@sha256:c65a00f628cc5a9bb2dcb2c84f860bd34da567f9b77584eaa6a93d2dfb134a0c \
            lint
